name: CI

on:
  push:
    branches: [main, windows]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: brew install ffmpeg
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -m "not slow"

  app:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json  # 版本取 app/package.json 的 packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # 界面构建产物随 Python 包发布，必须和源码同步提交
      - run: git diff --exit-code -- ../src/tingo/web
      # 在 src-tauri / engine 目录里跑，才会用上 rust-toolchain.toml 固定的版本
      - run: cargo clippy -- -D warnings
        working-directory: app/src-tauri
      - run: cargo test --release --lib
        working-directory: app/engine

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo clippy -- -D warnings
        working-directory: app/src-tauri
      # 更新器：清单里没有本平台的包时按「没有更新」处理
      - run: cargo test --lib
        working-directory: app/src-tauri
      # 包括 Windows 专属的：Media Foundation 压缩 / 解码来回、Edge 打印 PDF、有声卡时试录
      - run: cargo test --release --lib
        working-directory: app/engine
      - run: pnpm tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: tingo-windows-installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
