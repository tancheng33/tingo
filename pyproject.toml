[project]
name = "tingo"
version = "0.5.5"
description = "本地中文会议录音、转写、说话人区分，一键生成会议纪要（FunASR + 任意 OpenAI 兼容大模型）"
license = "MIT"
keywords = ["meeting-minutes", "asr", "funasr", "chinese", "speaker-diarization", "transcription", "会议纪要"]
classifiers = [
    "Environment :: Console",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
readme = "README.md"
authors = [
    { name = "stardust", email = "642720202@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "funasr>=1.4.19",
    "httpx>=0.28.1",
    "modelscope>=1.40.2",
    "numpy>=2.4.6",
    "openai>=3.42.1",
    "python-multipart>=0.0.33",
    "pywebview>=6.2.1 ; sys_platform == 'darwin'",
    "rich>=15.0.0",
    "soundfile>=0.14.0",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 整个包目录都打进去：界面（web/）、录音组件源码（recorder.swift）、内置示例会议（sample/）
packages = ["src/tingo"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[project.urls]
Homepage = "https://github.com/tancheng33/tingo"

[project.scripts]
tingo = "tingo.cli:main"
jiyao = "tingo.cli:main"  # 改名前的命令，留着兼容

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
markers = ["slow: 需要下载识别模型的端到端测试"]
